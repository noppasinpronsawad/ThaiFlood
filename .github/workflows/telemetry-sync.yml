name: Telemetry Cache Ingestion (Every 10 Mins)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/api/**'
      - 'public/archive/**'
  schedule:
    # Run every 10 minutes to protect government APIs and maintain fresh Edge CDN cache
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Telemetry Ingestion Script
        run: node scripts/sync-telemetry.js

      - name: Commit & Push Updated Edge Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --force public/api/*.json
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): automated edge cache sync [skip ci]"
            git push
          fi
