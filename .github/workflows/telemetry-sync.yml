name: Telemetry Cache Ingestion (Every 10 Mins)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/api/**'
      - 'public/archive/**'
  schedule:
    # Run every 10 minutes with 2-minute offset to avoid GitHub runner queue congestion
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Telemetry Ingestion Script
        run: node scripts/sync-telemetry.js

      - name: Commit & Push Updated Edge Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --force public/api/ public/archive/
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): automated edge cache sync [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
